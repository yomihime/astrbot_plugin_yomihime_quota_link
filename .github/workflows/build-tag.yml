name: Build plugin on tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest ruff

      - name: Check code and run tests
        run: |
          ruff check .
          ruff format --check .
          python -m pytest -q

      - name: Build plugin ZIP
        run: python scripts/build_plugin.py --tag "$GITHUB_REF_NAME" --output-dir dist

      - name: Prepare release notes
        run: python scripts/release_notes.py --tag "$GITHUB_REF_NAME" --output dist/release-notes.md

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: astrbot_plugin_yomihime_quota_link-${{ github.ref_name }}
          path: dist/astrbot_plugin_yomihime_quota_link-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/astrbot_plugin_yomihime_quota_link-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
